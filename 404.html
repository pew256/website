<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page Not Found | pew256</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #f8fafc 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            font-size: 1.125rem;
            margin-bottom: 2rem;
        }
        .redirect-btn {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .redirect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
    </style>
    <script>
        // Start a 3-second auto-redirect
        setTimeout(function() {
            window.location.replace('/');
        }, 3000);
    </script>
</head>
<body>
    <h1 id="page_404_title" data-i18n="page_404_title">404</h1>
    <p id="page_404_subtitle" data-i18n="page_404_subtitle">The signal was lost. Redirecting you back to base...</p>
    <a href="/" id="page_404_btn" data-i18n="page_404_btn" class="redirect-btn">Return to pew256.com</a>

    <script>
        const detectLang = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && ['en', 'fr', 'es', 'de', 'ar'].includes(urlLang)) {
                localStorage.setItem('pew256_lang', urlLang);
                return urlLang;
            }
            const storedLang = localStorage.getItem('pew256_lang');
            if (storedLang && ['en', 'fr', 'es', 'de', 'ar'].includes(storedLang)) return storedLang;
            const browserLang = navigator.language.substring(0, 2);
            if (['en', 'fr', 'es', 'de', 'ar'].includes(browserLang)) return browserLang;
            return 'en';
        };
        const userLang = detectLang();
        document.addEventListener('DOMContentLoaded', () => {
            fetch(`/api/config?lang=${userLang}`)
                .then(res => res.json())
                .then(config => {
                    const keys = ['page_404_title', 'page_404_subtitle', 'page_404_btn'];
                    keys.forEach(key => {
                        if(config[key]) {
                            const el = document.getElementById(key);
                            if (el) el.innerHTML = config[key];
                        }
                    });
                });
        });
    </script>
</body>
</html>
